name: Gaia runtime images

# Builds gaia-env:current and gaia-env:next from gaia/env and checks their PHP and Phalcon versions.
# Pull requests only build and check; a push to dev (or a manual run) also publishes to ghcr.io/projects4me/gaia-env.

on:
  push:
    branches: [dev]
    paths:
      - 'gaia/env/**'
      - '.github/workflows/gaia-env.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'gaia/env/**'
      - '.github/workflows/gaia-env.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gaia-env-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/projects4me/gaia-env

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [current, next]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read build args
        id: args
        run: |
          f=gaia/env/${{ matrix.stack }}.args
          grep -Ev '^[[:space:]]*(#|$)' "$f" | tr -d '\r' > "$RUNNER_TEMP/args"
          php=$(sed -n 's/^BASE_IMAGE=php:\([0-9][0-9.]*\)-.*/\1/p' "$RUNNER_TEMP/args")
          phalcon=$(sed -n 's/^PHALCON_VERSION=//p' "$RUNNER_TEMP/args")
          if [ -z "$php" ] || [ -z "$phalcon" ]; then
            echo "::error::cannot read the PHP or Phalcon version from $f"; exit 1
          fi
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "phalcon=$phalcon" >> "$GITHUB_OUTPUT"
          echo "version=${php}-phalcon${phalcon}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          { echo 'list<<EOF'; cat "$RUNNER_TEMP/args"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: gaia/env
          build-args: ${{ steps.args.outputs.list }}
          load: true
          tags: gaia-env:${{ matrix.stack }}
          cache-from: type=gha,scope=gaia-env-${{ matrix.stack }}
          cache-to: type=gha,scope=gaia-env-${{ matrix.stack }},mode=max

      - name: Check versions
        run: |
          got=$(docker run --rm gaia-env:${{ matrix.stack }} php -r 'echo PHP_VERSION, " ", phpversion("phalcon");')
          want="${{ steps.args.outputs.php }} ${{ steps.args.outputs.phalcon }}"
          echo "PHP / Phalcon: $got (expected $want)"
          [ "$got" = "$want" ] || { echo "::error::expected $want, got $got"; exit 1; }
          docker run --rm gaia-env:${{ matrix.stack }} php -m | grep -qix pdo_pgsql
          docker run --rm gaia-env:${{ matrix.stack }} composer --version
          docker run --rm gaia-env:${{ matrix.stack }} phpunit --version

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as Build, so every layer comes from the cache.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: gaia/env
          build-args: ${{ steps.args.outputs.list }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.stack }}
            ${{ env.IMAGE }}:${{ steps.args.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.args.outputs.version }}-${{ steps.args.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Gaia runtime (${{ matrix.stack }}): PHP ${{ steps.args.outputs.php }}, Phalcon ${{ steps.args.outputs.phalcon }}, Apache
          cache-from: type=gha,scope=gaia-env-${{ matrix.stack }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### gaia-env:${{ matrix.stack }}"
            echo "- \`${{ env.IMAGE }}:${{ matrix.stack }}\`"
            echo "- \`${{ env.IMAGE }}:${{ steps.args.outputs.version }}\`"
            echo "- \`${{ env.IMAGE }}:${{ steps.args.outputs.version }}-${{ steps.args.outputs.sha }}\` (never moves)"
          } >> "$GITHUB_STEP_SUMMARY"
